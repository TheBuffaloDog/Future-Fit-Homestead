name: Update data

on:
  schedule:
    - cron: "0 8 * * 1,4"   # Monday and Thursday, 8am UTC
  workflow_dispatch:

jobs:
  run-pipelines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch county boundaries
        working-directory: etl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python fetch_county_boundaries.py

      - name: Wait for boundaries to commit
        run: sleep 10

      - name: Fetch FEMA National Risk Index
        working-directory: etl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python fetch_fema_nri.py

      - name: Fetch US Drought Monitor
        working-directory: etl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python fetch_drought_monitor.py
