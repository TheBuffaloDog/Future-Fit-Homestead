name: Update data

on:
  schedule:
    - cron: "0 8 * * 1"   # every Monday, 8am UTC
  workflow_dispatch:        # adds a manual "Run workflow" button in GitHub's UI

jobs:
  run-pipelines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch county boundaries
        working-directory: etl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python fetch_county_boundaries.py

      - name: Fetch FEMA National Risk Index
        working-directory: etl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python fetch_fema_nri.py
