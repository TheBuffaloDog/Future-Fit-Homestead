<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Future-Fit Homestead</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12100D; --surface: #1B2019; --surface-raised: #212820;
    --border: #303B32; --text-primary: #EDEAE0; --text-muted: #8B958C;
    --tier1: #C98A3B; --tier2: #6B93A6; --tier3: #83887F;
    --font-ui: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text-primary); font-family: var(--font-ui); }
  .app { display: flex; flex-direction: column; height: 100vh; }
  .topbar {
    display: flex; align-items: baseline; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
  }
  .topbar h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; margin: 0; text-transform: uppercase; }
  .status-badge {
    font-family: var(--font-mono); font-size: 11px;
    border-radius: 3px; padding: 2px 7px; letter-spacing: 0.04em;
  }
  .status-badge.live { color: #6fcf97; border: 1px solid #6fcf97; }
  .status-badge.loading { color: var(--tier1); border: 1px dashed var(--tier1); }
  .topbar .tagline { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .layout { display: flex; flex: 1; min-height: 0; }
  .sidebar {
    width: 280px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border); overflow-y: auto; padding: 16px;
  }
  .sidebar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin: 0 0 12px; }
  .category-group { margin-bottom: 16px; }
  .category-group summary {
    font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 0;
    list-style: none; display: flex; align-items: center; gap: 6px;
  }
  .category-group summary::before { content: '▸'; color: var(--text-muted); font-size: 10px; transition: transform 0.15s; }
  .category-group[open] summary::before { transform: rotate(90deg); }
  .category-group summary::-webkit-details-marker { display: none; }
  .layer-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 4px 6px 14px; font-size: 13px; border-radius: 4px; cursor: pointer;
  }
  .layer-row:hover { background: var(--surface-raised); }
  .layer-row input[type=checkbox] { accent-color: var(--tier1); width: 14px; height: 14px; flex-shrink: 0; }
  .layer-row label { flex: 1; cursor: pointer; }
  .layer-row .pending { color: var(--text-muted); font-style: italic; }
  .tier-mark { width: 16px; height: 0; border-top-width: 2px; border-top-style: solid; flex-shrink: 0; }
  .tier-mark.t1 { border-top-color: var(--tier1); }
  .tier-mark.t2 { border-top-color: var(--tier2); border-top-style: dashed; }
  .tier-mark.t3 { border-top-color: var(--tier3); border-top-style: dotted; }
  .map-wrap { position: relative; flex: 1; }
  #map { position: absolute; inset: 0; }
  .floating-card {
    position: absolute; background: var(--surface-raised);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 12px 14px; font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  }
  .legend { bottom: 16px; left: 16px; }
  .legend h3 { margin: 0 0 8px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .legend-row span.label { color: var(--text-muted); }
  .popup-content { font-size: 13px; color: #1a1a1a; max-width: 240px; }
  .popup-content strong { display: block; margin-bottom: 6px; font-size: 14px; }
  .popup-content .metric { display: flex; justify-content: space-between; margin: 3px 0; }
  .popup-content .metric span:last-child { font-weight: 600; }
  .loading-overlay {
    position: absolute; inset: 0; background: rgba(18,16,13,0.7);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--text-muted); z-index: 10;
    pointer-events: none; transition: opacity 0.3s;
  }
  .loading-overlay.hidden { opacity: 0; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>Future-Fit Homestead</h1>
    <span class="status-badge loading" id="status-badge">CONNECTING...</span>
    <span class="tagline" id="tagline">Loading real data from Supabase</span>
  </div>
  <div class="layout">
    <div class="sidebar">
      <h2>Data layers</h2>
      <div id="category-groups"></div>
      <div style="margin-top:20px; padding-top:16px; border-top:1px solid var(--border);">
        <h2>Legend</h2>
        <div class="legend-row"><span class="tier-mark t1"></span><span class="label" style="font-size:11px;color:var(--text-muted)">Tier 1 — physical, high confidence</span></div>
        <div class="legend-row"><span class="tier-mark t2"></span><span class="label" style="font-size:11px;color:var(--text-muted)">Tier 2 — resource, medium confidence</span></div>
        <div class="legend-row"><span class="tier-mark t3"></span><span class="label" style="font-size:11px;color:var(--text-muted)">Tier 3 — social/policy, directional only</span></div>
      </div>
    </div>
    <div class="map-wrap">
      <div id="map"></div>
      <div class="loading-overlay" id="loading-overlay">Loading map data...</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
  // ── Config ────────────────────────────────────────────────────────────────
  const SUPABASE_URL = 'hwxxmwxxrkngtozyhofo.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_sKCWGpIAVs1LdHY96NPi1w_fBcaiGpD';

  const CATEGORY_NAMES = {
    REF: 'Base Reference', A: 'Climate & Weather', B: 'Water Resources',
    C: 'Soil & Agriculture', D: 'Natural Hazards', E: 'Disease & Invasive Species',
    F: 'Land Use & Zoning', G: 'Land Availability', H: 'Hunting & Fishing',
    I: 'Infrastructure', J: 'Economic & Demographic', K: 'Insurance & Financial Risk',
    L: 'Health & Community', M: 'Governance & Policy', N: 'Environmental Quality',
  };

  const TIER_HEX = { 1: '#C98A3B', 2: '#6B93A6', 3: '#83887F' };
  const TIER_DASH = { 1: null, 2: [3, 2], 3: [1, 2] };

  // Color ramps per layer slug — maps a numeric property to a color
  const LAYER_STYLE = {
    'fema-nri-county': {
      prop: 'composite_risk_score',
      label: 'Composite Risk Score',
      stops: [[0,'#2d6a4f'],[25,'#74c69d'],[50,'#ffd166'],[75,'#ef6c00'],[100,'#b91c1c']],
    },
    'usdm-drought-county': {
      prop: 'pct_severe_drought',
      label: '% Severe Drought',
      stops: [[0,'#2d6a4f'],[25,'#ffd166'],[50,'#ef6c00'],[75,'#b91c1c'],[100,'#7f0000']],
    },
  };

  // Pending layers — shown in sidebar but no pipeline yet
  const PENDING = [
    { id: 'plant-hardiness',     category: 'A', name: 'Plant Hardiness Zone (projected)', tier: 1 },
    { id: 'groundwater-level',   category: 'B', name: 'Groundwater Level Trend',          tier: 2 },
    { id: 'prime-farmland',      category: 'C', name: 'Prime Farmland',                   tier: 1 },
    { id: 'tick-range',          category: 'E', name: 'Tick Range Expansion',             tier: 1 },
    { id: 'insurance-risk',      category: 'K', name: 'Insurance Non-Renewal Rate',       tier: 2 },
    { id: 'hospital-proximity',  category: 'L', name: 'Rural Hospital Proximity',         tier: 1 },
  ];

  // ── State ────────────────────────────────────────────────────────────────
  let map, realLayers = [], checked = new Set();

  // ── Supabase helpers ──────────────────────────────────────────────────────
  const sbHeaders = {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
  };

  async function fetchLayers() {
    const res = await fetch(
      `https://${SUPABASE_URL}/rest/v1/layers?select=*&category=neq.REF&order=category`,
      { headers: sbHeaders }
    );
    return res.ok ? res.json() : [];
  }

  async function fetchGeoJSON(slug) {
    const res = await fetch(
      `https://${SUPABASE_URL}/rest/v1/features_geojson?select=geometry,properties&layer_slug=eq.${slug}`,
      { headers: sbHeaders }
    );
    if (!res.ok) throw new Error(`${res.status}`);
    const rows = await res.json();
    return {
      type: 'FeatureCollection',
      features: rows.map(r => ({ type: 'Feature', geometry: r.geometry, properties: r.properties })),
    };
  }

  // ── Sidebar ───────────────────────────────────────────────────────────────
  function buildSidebar(layers) {
    const all = [
      ...layers.map(l => ({ id: l.slug, category: l.category, name: l.name, tier: l.confidence_tier, real: true })),
      ...PENDING,
    ];
    const groups = {};
    for (const l of all) (groups[l.category] ||= []).push(l);

    const container = document.getElementById('category-groups');
    container.innerHTML = '';
    for (const [cat, items] of Object.entries(groups)) {
      const details = document.createElement('details');
      details.className = 'category-group';
      details.open = items.some(i => i.real);
      details.innerHTML = `<summary>${cat} — ${CATEGORY_NAMES[cat] || cat}</summary>`;
      for (const item of items) {
        const row = document.createElement('div');
        row.className = 'layer-row';
        row.innerHTML = `
          <input type="checkbox" id="chk-${item.id}" data-id="${item.id}" data-real="${item.real || false}" ${item.real ? '' : 'title="Pipeline not built yet"'}>
          <span class="tier-mark t${item.tier}"></span>
          <label for="chk-${item.id}" class="${item.real ? '' : 'pending'}">${item.name}</label>
        `;
        details.appendChild(row);
      }
      container.appendChild(details);
    }
    container.querySelectorAll('input[type=checkbox]').forEach(el => {
      el.addEventListener('change', e => onToggle(e.target.dataset.id, e.target.checked, e.target.dataset.real === 'true'));
    });
  }

  // ── Map layer toggle ──────────────────────────────────────────────────────
  async function onToggle(id, isOn, isReal) {
    if (!isReal) return;
    const sourceId = `src-${id}`;
    const fillId = `fill-${id}`;
    const lineId = `line-${id}`;
    const layer = realLayers.find(l => l.slug === id);

    if (isOn) {
      checked.add(id);
      if (!map.getSource(sourceId)) {
        document.getElementById('loading-overlay').classList.remove('hidden');
        document.getElementById('loading-overlay').textContent = `Loading ${layer?.name || id}...`;
        try {
          const geojson = await fetchGeoJSON(id);
          map.addSource(sourceId, { type: 'geojson', data: geojson });

          const style = LAYER_STYLE[id];
          const paintProps = style
            ? {
                'fill-color': ['interpolate', ['linear'],
                  ['to-number', ['get', style.prop], 0],
                  ...style.stops.flatMap(([v, c]) => [v, c])
                ],
                'fill-opacity': 0.65,
              }
            : { 'fill-color': TIER_HEX[layer?.confidence_tier || 1], 'fill-opacity': 0.4 };

          map.addLayer({ id: fillId, type: 'fill', source: sourceId, paint: paintProps });
          map.addLayer({
            id: lineId, type: 'line', source: sourceId,
            paint: {
              'line-color': TIER_HEX[layer?.confidence_tier || 1],
              'line-width': 0.8,
              ...(TIER_DASH[layer?.confidence_tier] ? { 'line-dasharray': TIER_DASH[layer.confidence_tier] } : {}),
            },
          });

          // Popup on click
          map.on('click', fillId, e => {
            const props = e.features[0].properties;
            const style = LAYER_STYLE[id];
            const rows = style
              ? `<div class="metric"><span>${style.label}</span><span>${parseFloat(props[style.prop] || 0).toFixed(1)}</span></div>`
              : Object.entries(props).filter(([k]) => !['fips','state_fips'].includes(k))
                  .slice(0, 5).map(([k, v]) => `<div class="metric"><span>${k}</span><span>${v}</span></div>`).join('');
            new maplibregl.Popup()
              .setLngLat(e.lngLat)
              .setHTML(`<div class="popup-content"><strong>${props.name || props.county || props.fips}</strong>${rows}</div>`)
              .addTo(map);
          });
          map.on('mouseenter', fillId, () => map.getCanvas().style.cursor = 'pointer');
          map.on('mouseleave', fillId, () => map.getCanvas().style.cursor = '');

        } catch (err) {
          console.error('Failed to load layer:', err);
        }
        document.getElementById('loading-overlay').classList.add('hidden');
      } else {
        map.setLayoutProperty(fillId, 'visibility', 'visible');
        map.setLayoutProperty(lineId, 'visibility', 'visible');
      }
    } else {
      checked.delete(id);
      if (map.getLayer(fillId)) {
        map.setLayoutProperty(fillId, 'visibility', 'none');
        map.setLayoutProperty(lineId, 'visibility', 'none');
      }
    }
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  async function init() {
    map = new maplibregl.Map({
      container: 'map',
      style: 'https://demotiles.maplibre.org/style.json',
      center: [-96, 38],
      zoom: 3.8,
    });
    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    try {
      realLayers = await fetchLayers();
      buildSidebar(realLayers);
      document.getElementById('status-badge').textContent = 'LIVE DATA';
      document.getElementById('status-badge').className = 'status-badge live';
      document.getElementById('tagline').textContent =
        `${realLayers.length} layer${realLayers.length !== 1 ? 's' : ''} connected — check boxes to overlay on map`;
    } catch (err) {
      document.getElementById('status-badge').textContent = 'OFFLINE';
      document.getElementById('tagline').textContent = 'Could not reach Supabase — check config';
      buildSidebar([]);
    }
    document.getElementById('loading-overlay').classList.add('hidden');
  }

  init();
</script>
</body>
</html>
